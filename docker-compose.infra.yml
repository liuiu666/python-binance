# ============================================================
# 基础设施 — 仅数据库服务 (本地开发调试用)
# 启动: docker-compose -f docker-compose.infra.yml up -d
# 停止: docker-compose -f docker-compose.infra.yml down
# 清数据: docker-compose -f docker-compose.infra.yml down -v
# ============================================================

version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: bxm40-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: bxm40-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: bxm40
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bxm40-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bxm40
      POSTGRES_USER: bxm40
      POSTGRES_PASSWORD: bxm40_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bxm40"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  postgres_data:
    driver: local
